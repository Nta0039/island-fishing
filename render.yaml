# Render Blueprint — lets Render configure the service automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: island-fishing
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
